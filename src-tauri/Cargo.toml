[package]
name = "multisearch-desktop"
version = "0.1.0"
description = "MultiSearch / 聚合搜索 — 一次输入，多引擎结果入口"
authors = ["曹"]
edition = "2021"

[lib]
name = "multisearch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
