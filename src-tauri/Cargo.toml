[package]
name = "multisearch-desktop"
version = "0.2.0"
description = "MultiSearch / 聚合搜索 — 一次输入，多引擎并行聚合"
authors = ["曹"]
edition = "2021"

[lib]
name = "multisearch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "cookies"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
scraper = "0.22"
regex = "1"
urlencoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
